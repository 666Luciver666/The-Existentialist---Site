<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Existentialist</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", serif;
      background-color: #000;
      color: #fff;
      text-align: center;
    }

    .hero {
      position: relative;
      height: 100vh;
      background: url("mirror.JPG?v=1") center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 90%;
    }

    h1 {
      font-size: 2.6em;
      margin-bottom: 0.2em;
    }

    p {
      font-size: 1.1em;
      margin-top: 0;
      opacity: 0.9;
    }

    .button {
      margin-top: 1.6em;
      padding: 0.75em 2em;
      font-size: 1.1em;
      color: #000;
      background-color: #e7c94a;
      border: none;
      border-radius: 3px;
      text-decoration: none;
      transition: background 0.25s ease;
    }

    .button:hover {
      background-color: #c7a94a;
    }

    footer {
      margin-top: 2em;
      font-size: 0.85em;
      color: #888;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h1>The Existentialist</h1>
      <p>Lucia · Fine Art Print</p>
      <p>From “The Existentialist” Series — Manuel Cech</p>
      <a class="button" href="https://buy.stripe.com/5kQ5kw6BV9XS25l5PEfMA00" target="_blank">Buy Print · €119</a>
    </div>
  </section>

  <footer>
    © Manuel Cech 2025 — Fuerteventura
  </footer>
</body>
</html>
