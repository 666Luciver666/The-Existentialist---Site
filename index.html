<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Existentialist · Manuel Cech</title>
  <style>
    body {
      margin: 0;
      font-family: "Times New Roman", serif;
      background-color: #000;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }

    .hero {
      background-image: url("mirror.JPG");
      background-size: cover;
      background-position: center;
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .hero h1 {
      font-size: 3rem;
      color: #fff;
      text-shadow: 0 0 20px #000;
      margin: 0;
    }

    .hero h2 {
      font-size: 1.2rem;
      color: #ccc;
      margin-top: 10px;
    }

    .art-section {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      background-color: #000;
      padding: 50px 0;
    }

    .art-image {
      flex: 1;
      max-width: 400px;
      margin: 10px;
    }

    .art-image img {
      width: 100%;
      border: 2px solid #333;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    .art-info {
      flex: 1;
      max-width: 400px;
      margin: 10px;
      text-align: left;
    }

    .art-info h3 {
      color: #fff;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .art-info p {
      color: #ccc;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    .buy-button {
      display: inline-block;
      background-color: #ffd700;
      color: #000;
      padding: 10px 20px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
    }

    .buy-button:hover {
      background-color: #c7a94a;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>The Existentialist</h1>
    <h2>By Manuel Cech — Multidisciplinary Artist & Illusion Designer</h2>
  </div>

  <section class="art-section">
    <div class="art-image">
      <img src="lucia.JPG" alt="Lucia Fine Art Print">
      <p><em>From “The Existentialist” Series — Manuel Cech</em></p>
    </div>
    <div class="art-info">
      <h3>Lucia · Fine Art Print</h3>
      <p>Museum-grade fine art giclée print.<br>€119</p>
      <a class="buy-button" href="https://buy.stripe.com/5kQ5kw6BV9XS25l5PEfMA00" target="_blank">Buy Print · €119</a>
      <p><small>Secure payment via Stripe</small></p>
    </div>
  </section>

  <footer>
    © Manuel Cech 2025 — Fuerteventura
  </footer>
</body>
</html>
