<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Existentialist — Manuel Cech</title>
  <meta name="description" content="The Existentialist — Fine art prints by Manuel Cech" />
  <style>
    :root{
      --bg:#0b0b0b; --ink:#eaeaea; --muted:#cfcfcf; --line:#1f1f1f;
      --accent:#c7a94a; --accent-ink:#111; --wrap:1000px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font-family:"Times New Roman",Georgia,serif;}
    img{max-width:100%;display:block;}
    a{color:inherit;text-decoration:none;}

    /* HERO (Mirror static) */
    .hero{
      min-height:55vh;display:flex;align-items:center;justify-content:center;
      text-align:center;background:#000 url("mirror.JPG") center/cover no-repeat;
      border-bottom:1px solid var(--line);
    }
    .hero h1{
      font-size:3rem;margin:0;color:var(--accent);
      text-shadow:0 1px 2px rgba(0,0,0,0.45); /* feiner Schatten */
    }
    .hero p{
      font-size:1.1rem;margin-top:.5rem;color:var(--ink);
    }

    /* SECTION */
    section{max-width:var(--wrap);margin:0 auto;padding:4rem 1rem;}
    h2{color:var(--accent);margin-bottom:.5rem;}
    p{line-height:1.6;color:var(--muted);}
    .art{
      display:grid;grid-template-columns:1fr 1fr;gap:2rem;
      align-items:center;border-top:1px solid var(--line);padding-top:4rem;
    }
    @media(max-width:800px){.art{grid-template-columns:1fr;}}

    /* FOOTER */
    footer{
      text-align:center;padding:3rem 1rem;border-top:1px solid var(--line);
      color:var(--muted);font-size:.9rem;
    }
  </style>
</head>

<body>
  <!-- HERO -->
  <div class="hero">
    <div>
      <h1>The Existentialist</h1>
      <p>Manuel Cech · Multidisciplinary Artist & Illusion Designer</p>
    </div>
  </div>

  <!-- ARTWORK SECTION -->
  <section class="art">
    <img src="lucia.JPG" alt="Lucia — Fine Art Print by Manuel Cech">
    <div>
      <h2>Lucia (2025)</h2>
      <p>
        Pastel on Pastelmat<br><br>
        The first work of a new era — between light and decay.<br>
        For my beloved sister.
      </p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    © 2025 Manuel Cech · The Existentialist Series
  </footer>
</body>
</html>
