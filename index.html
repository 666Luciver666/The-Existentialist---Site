<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Existentialist — Manuel Cech</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0b0b0b;
      color: #eaeaea;
      font-family: "Times New Roman", serif;
    }
    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .hero {
      width: min(90vw, 700px);
      aspect-ratio: 1/1;
      background: url("mirror.jpg") center/cover no-repeat;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      border: 1px solid #222;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(28px, 3.5vw, 42px);
      margin: 0;
    }
    p.sub {
      font-size: clamp(14px, 2vw, 18px);
      opacity: 0.8;
      margin: 8px 0 24px 0;
    }
    a.btn {
      display: inline-block;
      padding: 14px 24px;
      border: 1px solid #777;
      border-radius: 5px;
      text-decoration: none;
      color: #fff;
      background: #141414;
      transition: all 0.2s ease;
    }
    a.btn:hover {
      background: #1f1f1f;
      border-color: #aaa;
      transform: translateY(-1px);
    }
    footer {
      opacity: 0.6;
      font-size: 12px;
      margin-top: 40px;

</head>

  <div class="container">

</body>
</html>
