<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Existentialist — Manuel Cech</title>
  <meta name="description" content="Fine art prints by Manuel Cech — The Existentialist Series." />
  <style>
    :root{
      --fg:#e8e8e8; --muted:#b6b6b6; --gold:#e5c84a;
      --maxw:1100px; --border:#111;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#000;color:var(--fg);font-family:"Times New Roman",serif}

    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

    /* HERO */
    .hero{
      position:relative; min-height:68vh;
      display:flex; align-items:center; justify-content:center; text-align:center;
      background:#000 url("mirror.jpg?v=4") center/cover no-repeat;
      border-bottom:1px solid var(--border);
      /* kein fixed, damit es auf iOS sicher lädt */
      background-attachment:scroll;
    }
    .hero::after{
      content:""; position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.65));
    }
    .hero-inner{position:relative; z-index:1; padding:48px 16px}
    .title{font-size:clamp(36px,6vw,72px); margin:0 0 8px; text-shadow:0 1px 2px #000}
    .subtitle{font-size:clamp(14px,1.8vw,18px); color:var(--muted); margin:0}

    /* PRODUKT */
    .section{background:#0a0a0a; padding:36px 0; border-top:1px solid var(--border)}
    .grid{display:grid; gap:28px; grid-template-columns:1fr; align-items:center}
    @media(min-width:820px){ .grid{grid-template-columns:1.1fr .9fr} }

    .card{background:rgba(0,0,0,.45); border:1px solid #1b1b1b; border-radius:10px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .card-media{aspect-ratio:4/5; background:#111}
    .card-media img{width:100%; height:100%; object-fit:cover; display:block}
    .card-body{padding:18px}
    .h2{margin:0 0 6px; font-size:clamp(20px,2.6vw,28px)}
    .muted{color:var(--muted); font-size:14px}
    .price{margin:14px 0; font-weight:bold}
    .btn{
      display:inline-block; padding:10px 18px; border-radius:6px; font-size:16px; font-weight:bold;
      background:var(--gold); color:#111; border:1px solid #9e8f2a; box-shadow:0 2px 0 #7a6d1f;
      text-decoration:none;
    }
    .btn:hover{filter:brightness(1.05)}
    .btn:active{transform:translateY(1px)}
    .cta-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
